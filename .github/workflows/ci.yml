name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas da mesma branch/PR quando chega um push novo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: src/PokemonRecommender/PokemonRecommender.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore $PROJECT

      - name: Build
        run: dotnet build $PROJECT -c Release --no-restore

  integration:
    name: Testes de integração (Postman)
    runs-on: ubuntu-latest
    needs: build

    # Mesmo banco do docker-compose.yml (Postgres 17 + pgvector)
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: s03dicas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d s03dicas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ASPNETCORE_ENVIRONMENT: Development # em Development a API aplica as migrations ao subir
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=s03dicas;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Subir a API em background
        run: |
          nohup dotnet run --project $PROJECT -c Release --urls http://localhost:5242 > api.log 2>&1 &

      - name: Esperar a API ficar pronta
        run: |
          curl --silent --fail --retry 40 --retry-delay 3 --retry-all-errors \
            http://localhost:5242/openapi/v1.json > /dev/null

      - name: Rodar coleção Postman (Newman)
        run: |
          npm install -g newman newman-reporter-htmlextra
          newman run tests/postman/recomendacao-de-cartas.postman_collection.json \
            --env-var base_url=http://localhost:5242 \
            -r cli,htmlextra,json \
            --reporter-htmlextra-export newman-report/report.html \
            --reporter-json-export newman-report/report.json

      - name: Resumo na página da execução
        if: always() && hashFiles('newman-report/report.json') != ''
        run: |
          node <<'EOF'
          const fs = require("fs");
          const run = JSON.parse(fs.readFileSync("newman-report/report.json", "utf8")).run;
          const rows = run.executions.map(e => {
            const a = e.assertions || [];
            const bad = a.filter(x => x.error).length;
            return `| ${bad === 0 ? "✅" : "❌"} | ${e.item.name} | ${e.response ? e.response.code : "-"} | ${a.length - bad}/${a.length} |`;
          });
          const s = run.stats;
          const md = [
            "## Testes de integração (Newman)",
            "",
            `Requests: ${s.requests.total} · Asserções: ${s.assertions.total - s.assertions.failed}/${s.assertions.total} passaram`,
            "",
            "| | Request | Status | Asserções |",
            "|---|---|---|---|",
            ...rows,
            ""
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          EOF

      - name: Anexar relatório do Newman
        if: always() && hashFiles('newman-report/report.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report/

      - name: Anexar log da API se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: api.log